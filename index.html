<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D魔方自定义上色+自动复原系统</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
        body {background:#1a1a2e;color:#fff;padding:20px}
        .container {max-width:1400px;margin:0 auto;display:grid;grid-template-columns:320px 1fr;gap:24px}
        .panel {background:#16213e;padding:20px;border-radius:12px}
        h2 {margin-bottom:16px;color:#4fc3f7}
        .color-pick {display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
        .color-btn {width:40px;height:40px;border-radius:6px;border:3px solid transparent;cursor:pointer}
        .color-btn.active {border-color:#fff;scale:1.1}
        /* 魔方标准六色 */
        .w {background:#ffffff}
        .y {background:#ffd600}
        .r {background:#e53935}
        .o {background:#fb8c00}
        .b {background:#1e88e5}
        .g {background:#43a047}
        .control-group {margin:16px 0;display:flex;flex-direction:column;gap:10px}
        button {padding:10px 14px;border:none;border-radius:6px;cursor:pointer;font-size:15px;font-weight:500}
        .btn-primary {background:#2196f3;color:#fff}
        .btn-warning {background:#f57c00;color:#fff}
        .btn-danger {background:#d32f2f;color:#fff}
        .info-box {margin-top:16px;padding:12px;background:#0f3460;border-radius:8px;min-height:80px}
        #cubeCanvas {width:100%;height:620px;border-radius:12px;background:#000}
        .tip {font-size:13px;color:#b0b0b0;margin-top:8px}
    </style>
</head>
<body>
<div class="container">
    <!-- 左侧控制面板 -->
    <div class="panel">
        <h2>魔方上色 & 控制</h2>
        <p>选择颜色后点击魔方方块填充</p>
        <div class="color-pick">
            <div class="color-btn w active" data-color="U"></div>
            <div class="color-btn y" data-color="D"></div>
            <div class="color-btn r" data-color="R"></div>
            <div class="color-btn o" data-color="L"></div>
            <div class="color-btn b" data-color="F"></div>
            <div class="color-btn g" data-color="B"></div>
        </div>
        <div class="tip">U=白顶 D=黄底 R=右红 L=左橙 F=前蓝 B=后绿</div>

        <div class="control-group">
            <button class="btn-primary" id="solveBtn">一键自动复原魔方</button>
            <button class="btn-primary" id="autoPlayBtn">自动播放复原动画</button>
            <button id="stepBtn">单步执行一步还原</button>
            <button class="btn-warning" id="shuffleBtn">随机打乱魔方</button>
            <button class="btn-danger" id="resetBtn">重置魔方空白</button>
        </div>

        <h3>还原步骤</h3>
        <div class="info-box" id="stepInfo">等待上色或打乱魔方...</div>
        <div class="tip">点击3D魔方任意小方块修改色块颜色</div>
    </div>

    <!-- 右侧3D魔方画布 -->
    <div>
        <canvas id="cubeCanvas"></canvas>
    </div>
</div>

<!-- 引入Three.js 3D渲染库 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<!-- 魔方还原核心算法 Kociemba 二阶段最优解 -->
<script src="https://cdn.jsdelivr.net/npm/kociemba@2.0.6/dist/kociemba.min.js"></script>

<script>
// ========== 全局变量 ==========
let scene, camera, renderer, controls;
let cubePieces = []; // 54个小方块对象
let selectColor = 'U'; // 当前选中画笔颜色
let solveSteps = []; // 还原步骤数组
let stepIndex = 0;
let isAnimating = false;

// 魔方配色映射
const colorMap = {
    U: 0xffffff, // 白
    D: 0xffd600, // 黄
    R: 0xe53935, // 红
    L: 0xfb8c00, // 橙
    F: 0x1e88e5, // 蓝
    B: 0x43a047  // 绿
};
// 魔方面字符映射kociemba标准编码
const faceCode = {U:'U',D:'D',R:'R',L:'L',F:'F',B:'B'};

// ========== 初始化3D场景 ==========
function initThree() {
    const canvas = document.getElementById('cubeCanvas');
    renderer = new THREE.WebGLRenderer({canvas, antialias:true});
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a18);

    camera = new THREE.PerspectiveCamera(60, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
    camera.position.set(6, 6, 8);

    // 轨道控制器：拖拽旋转魔方、滚轮缩放
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // 灯光
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(10,10,10);
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    createCube();
    bindCanvasClick();
    animateLoop();
}

// ========== 创建完整3阶魔方（54个色块） ==========
function createCube() {
    const size = 0.95; // 小方块尺寸
    const gap = 0.06;
    const geo = new THREE.BoxGeometry(size, size, size);
    const offset = 1 + gap;

    // 六个面坐标偏移 U/D/L/R/F/B
    const faces = [
        {name:'U', axis:'y', dir:1, pos:[0,offset,0]},
        {name:'D', axis:'y', dir:-1, pos:[0,-offset,0]},
        {name:'F', axis:'z', dir:-1, pos:[0,0,-offset]},
        {name:'B', axis:'z', dir:1, pos:[0,0,offset]},
        {name:'R', axis:'x', dir:1, pos:[offset,0,0]},
        {name:'L', axis:'x', dir:-1, pos:[-offset,0,0]}
    ];

    cubePieces = [];
    // 遍历6个面，每个面3*9=9格
    faces.forEach(face=>{
        for(let x=-1;x<=1;x++){
            for(let y=-1;y<=1;y++){
                const mat = new THREE.MeshStandardMaterial({color:0x222222});
                const mesh = new THREE.Mesh(geo, mat);
                mesh.userData = {face:face.name, posX:x, posY:y, code:face.name};
                // 定位每个小方块
                mesh.position.set(
                    face.pos[0] + x*offset,
                    face.pos[1] + y*offset,
                    face.pos[2]
                );
                scene.add(mesh);
                cubePieces.push(mesh);
            }
        }
    })
}

// ========== 画布点击上色功能 ==========
function bindCanvasClick(){
    const canvas = document.getElementById('cubeCanvas');
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    canvas.addEventListener('click', (e)=>{
        if(isAnimating) return;
        const rect = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - rect.left) / rect.width * 2 - 1;
        mouse.y = -(e.clientY - rect.top) / rect.height * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(cubePieces);
        if(intersects.length>0){
            const hit = intersects[0].object;
            hit.material.color.set(colorMap[selectColor]);
            hit.userData.code = selectColor;
        }
    })
}

// ========== 颜色选择器绑定 ==========
document.querySelectorAll('.color-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
        document.querySelectorAll('.color-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        selectColor = btn.dataset.color;
    })
})

// ========== 获取当前魔方54位编码（kociemba标准） ==========
function getCubeCode(){
    // 顺序 U D L R F B 各9格
    let code = '';
    const order = ['U','D','L','R','F','B'];
    order.forEach(f=>{
        const faceBlocks = cubePieces.filter(m=>m.userData.face === f);
        // 固定排序 从上到下从左到右
        faceBlocks.sort((a,b)=>{
            if(a.userData.posY !== b.userData.posY) return b.userData.posY - a.userData.posY;
            return a.userData.posX - b.userData.posX;
        })
        faceBlocks.forEach(m=>code += m.userData.code);
    })
    return code;
}

// ========== 魔方还原逻辑 ==========
document.getElementById('solveBtn').addEventListener('click',()=>{
    const cubeStr = getCubeCode();
    try{
        const res = kociemba.solve(cubeStr);
        solveSteps = res.split(' ').filter(s=>s);
        stepIndex = 0;
        document.getElementById('stepInfo').innerText = `最优还原步骤：${res}\n总步数：${solveSteps.length}`;
    }catch(err){
        document.getElementById('stepInfo').innerText = "魔方色块不合法，请完整填充所有方块颜色！";
    }
})

// 单步还原
document.getElementById('stepBtn').addEventListener('click',()=>{
    if(isAnimating || stepIndex >= solveSteps.length) return;
    rotateCube(solveSteps[stepIndex]);
    stepIndex++;
    document.getElementById('stepInfo').innerText = `当前执行：${solveSteps.slice(0,stepIndex).join(' ')}`;
})

// 自动播放全部还原动画
document.getElementById('autoPlayBtn').addEventListener('click',async ()=>{
    if(solveSteps.length===0) return alert("请先生成还原步骤");
    isAnimating = true;
    for(;stepIndex < solveSteps.length;stepIndex++){
        await rotateCube(solveSteps[stepIndex]);
        document.getElementById('stepInfo').innerText = `执行进度：${stepIndex}/${solveSteps.length}`;
        await sleep(350);
    }
    isAnimating = false;
})

// 旋转魔方单层动画（简易旋转逻辑）
function rotateCube(move){
    return new Promise(resolve=>{
        const map = {
            U: {axis:'y', val:1, angle:Math.PI/2},
            U2:{axis:'y', val:1, angle:Math.PI},
            U_:{axis:'y', val:1, angle:-Math.PI/2},
            D: {axis:'y', val:-1, angle:-Math.PI/2},
            D2:{axis:'y', val:-1, angle:Math.PI},
            D_:{axis:'y', val:-1, angle:Math.PI/2},
            F: {axis:'z', val:-1, angle:Math.PI/2},
            F2:{axis:'z', val:-1, angle:Math.PI},
            F_:{axis:'z', val:-1, angle:-Math.PI/2},
            B: {axis:'z', val:1, angle:-Math.PI/2},
            B2:{axis:'z', val:1, angle:Math.PI},
            B_:{axis:'z', val:1, angle:Math.PI/2},
            R: {axis:'x', val:1, angle:Math.PI/2},
            R2:{axis:'x', val:1, angle:Math.PI},
            R_:{axis:'x', val:1, angle:-Math.PI/2},
            L: {axis:'x', val:-1, angle:-Math.PI/2},
            L2:{axis:'x', val:-1, angle:Math.PI},
            L_:{axis:'x', val:-1, angle:Math.PI/2},
        }
        const action = map[move];
        const targetBlocks = cubePieces.filter(m=>m.position[action.axis] > 0.3*action.val || m.position[action.axis] < -0.3*action.val);
        const dur = 300;
        const start = Date.now();
        function tick(){
            const t = Math.min((Date.now()-start)/dur,1);
            const rad = action.angle * t;
            targetBlocks.forEach(m=>{
                m.rotation[action.axis] = rad;
            })
            if(t<1) requestAnimationFrame(tick);
            else resolve();
        }
        tick();
    })
}

// 工具延时
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// 重置魔方清空颜色
document.getElementById('resetBtn').addEventListener('click',()=>{
    cubePieces.forEach(m=>{
        m.material.color.set(0x222222);
        m.userData.code = '';
    })
    solveSteps = [];
    stepIndex = 0;
    document.getElementById('stepInfo').innerText = "魔方已清空，请重新上色";
})

// 随机打乱魔方
document.getElementById('shuffleBtn').addEventListener('click',async ()=>{
    isAnimating = true;
    const shuffleMoves = ['U','U_','D','D_','R','R_','L','L_','F','F_','B','B_'];
    for(let i=0;i<22;i++){
        const r = shuffleMoves[Math.floor(Math.random()*shuffleMoves.length)];
        await rotateCube(r);
        await sleep(120);
    }
    isAnimating = false;
    document.getElementById('stepInfo').innerText = "魔方已随机打乱，点击一键复原生成解法";
})

// 渲染循环
function animateLoop(){
    requestAnimationFrame(animateLoop);
    controls.update();
    renderer.render(scene, camera);
}

// 窗口自适应
window.addEventListener('resize',()=>{
    const canvas = document.getElementById('cubeCanvas');
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
})

// 页面加载完成初始化
window.onload = initThree;
</script>
</body>
</html>
