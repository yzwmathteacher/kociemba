<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>3D三阶魔方 | 自定义涂色 + 自动复原系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif;}
body{background:#12121c;color:#fff;height:100vh;display:flex;overflow:hidden;}
#cubeWrap{width:65%;height:100%;position:relative;background:#000;}
#cubeCanvas{width:100%;height:100%;display:block;}
#panel{width:35%;padding:30px;background:#20202e;overflow-y:auto;z-index:10;position:relative;}
h2{margin-bottom:24px;color:#60a5fa;font-size:22px;}
.btn-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;}
button{padding:13px 8px;border:none;border-radius:9px;font-size:15px;cursor:pointer;background:#2563eb;color:#fff;transition:0.2s;pointer-events:auto !important;}
button:hover{background:#3b82f6;}
button.danger{background:#b93434;}
button.danger:hover{background:#dc3838;}
button:disabled{opacity:0.5;cursor:not-allowed;}
.info{background:#2b2b3f;padding:16px;border-radius:9px;margin:22px 0;line-height:1.7;font-size:14px;color:#cbd5e1;}
.color-select{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;}
.color-item{width:38px;height:38px;border-radius:7px;border:3px solid transparent;cursor:pointer;}
.color-item.active{border-color:#fff;transform:scale(1.08);}
#status{margin-top:14px;color:#94a3b8;font-size:15px;}
.formula-box{margin-top:18px;background:#2b2b3f;padding:12px;border-radius:8px;word-break:break-all;min-height:44px;}
</style>
</head>
<body>
<div id="cubeWrap">
    <canvas id="cubeCanvas"></canvas>
</div>
<div id="panel">
    <h2>魔方控制面板</h2>
    <div class="btn-group">
        <button id="btnScramble">随机打乱魔方</button>
        <button id="btnReset">重置魔方</button>
        <button id="btnSolve">自动复原魔方</button>
        <button class="danger" id="btnStop">停止动画</button>
    </div>
    <div class="info">
        <p>🖱️ 鼠标拖拽：旋转视角</p>
        <p>🔍 滚轮：缩放画面</p>
        <p>🎨 选择颜色后点击魔方小块涂色</p>
        <p>✅ 涂色完成后点击【自动复原】</p>
    </div>
    <div>
        <p>选择涂色颜色：</p>
        <div class="color-select">
            <div class="color-item active" data-letter="W" data-color="#ffffff" style="background:#fff"></div>
            <div class="color-item" data-letter="R" data-color="#ff3333" style="background:#ff3333"></div>
            <div class="color-item" data-letter="G" data-color="#00bb44" style="background:#00bb44"></div>
            <div class="color-item" data-letter="B" data-color="#2277ff" style="background:#2277ff"></div>
            <div class="color-item" data-letter="O" data-color="#ffaa22" style="background:#ffaa22"></div>
            <div class="color-item" data-letter="Y" data-color="#ffff22" style="background:#ffff22"></div>
        </div>
    </div>
    <div id="status">当前状态：初始复原状态</div>
    <div class="formula-box">复原公式：<span id="formulaText">无</span></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/kociemba@2.1.2/kociemba.min.js"></script>
<script>
let scene, camera, renderer, controls, raycaster, mouse;
let cubies = [];
let selectedHex = "#ffffff";
let selectedLetter = "W";
let animating = false;
const CUBE_SIZE = 1;
const GAP = 0.04;
const LETTER_COLOR = {W:0xffffff,R:0xff3333,G:0x00bb44,B:0x2277ff,O:0xffaa22,Y:0xffff22};
let cubeState = "WWWWWWWWWGGGRRRBBBOOOYYYYYYY";

// 初始化场景
function init(){
    const canvas = document.getElementById("cubeCanvas");
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x12121c);
    camera = new THREE.PerspectiveCamera(54, 0.65/0.35, 0.1, 200);
    camera.position.set(4.2,3.2,4.2);
    renderer = new THREE.WebGLRenderer({canvas,antialias:true});
    resizeCanvas();
    window.addEventListener("resize",resizeCanvas);
    controls = new THREE.OrbitControls(camera,canvas);
    controls.enableDamping=true;controls.dampingFactor=0.06;
    raycaster=new THREE.Raycaster();mouse=new THREE.Vector2();
    const ambient=new THREE.AmbientLight(0xffffff,0.65);
    scene.add(ambient);
    const dirLight=new THREE.DirectionalLight(0xffffff,0.75);
    dirLight.position.set(6,9,6);scene.add(dirLight);
    buildCube();
    bindCanvasClick();
    renderLoop();
}
function resizeCanvas(){
    const wrap=document.getElementById("cubeWrap");
    const w=wrap.clientWidth,h=wrap.clientHeight;
    camera.aspect=w/h;camera.updateProjectionMatrix();
    renderer.setSize(w,h);
}
function buildCube(){
    cubies.forEach(p=>scene.remove(p.mesh));
    cubies=[];
    const geo=new THREE.BoxGeometry(CUBE_SIZE-GAP,CUBE_SIZE-GAP,CUBE_SIZE-GAP);
    const pos=[-1,0,1];let idx=0;
    for(let x of pos)for(let y of pos)for(let z of pos){
        const mat=new THREE.MeshStandardMaterial({color:0x444444});
        const mesh=new THREE.Mesh(geo,mat);
        mesh.position.set(x,y,z);mesh.userData.index=idx++;
        scene.add(mesh);cubies.push({mesh,x,y,z});
    }
}
function renderLoop(){requestAnimationFrame(renderLoop);controls.update();renderer.render(scene,camera);}

// 点击涂色
function bindCanvasClick(){
    const canvas=document.getElementById("cubeCanvas");
    canvas.addEventListener("click",e=>{
        if(animating)return;
        const rect=canvas.getBoundingClientRect();
        mouse.x=((e.clientX-rect.left)/rect.width)*2-1;
        mouse.y=-((e.clientY-rect.top)/rect.height)*2+1;
        raycaster.setFromCamera(mouse,camera);
        const hit=raycaster.intersectObjects(cubies.map(c=>c.mesh));
        if(hit.length>0) hit[0].object.material.color.set(selectedHex);
    })
}

// 颜色选择器
document.querySelectorAll(".color-item").forEach(el=>{
    el.onclick=()=>{
        document.querySelectorAll(".color-item").forEach(e=>e.classList.remove("active"));
        el.classList.add("active");
        selectedHex=el.dataset.color;selectedLetter=el.dataset.letter;
    }
})

const status=document.getElementById("status");
const formulaDom=document.getElementById("formulaText");

// 重置魔方
document.getElementById("btnReset").onclick=()=>{
    if(animating)return;stopAll();
    cubeState="WWWWWWWWWGGGRRRBBBOOOYYYYYYY";
    status.textContent="当前状态：初始复原状态";formulaDom.textContent="无";
    cubies.forEach(c=>c.mesh.material.color.set(0x444444));
}
// 停止动画
document.getElementById("btnStop").onclick=()=>{stopAll();status.textContent="动画已停止";}
function stopAll(){animating=false;}

// 随机打乱
document.getElementById("btnScramble").onclick=async ()=>{
    if(animating)return;stopAll();animating=true;
    status.textContent="正在打乱魔方";
    const moves=["U","U'","D","D'","L","L'","R","R'","F","F'","B","B'"];
    let scramble="";
    for(let i=0;i<22;i++) scramble+=moves[Math.floor(Math.random()*moves.length)]+" ";
    formulaDom.textContent=scramble.trim();
    await sleep(1200);animating=false;status.textContent="魔方已打乱";
}

// 自动复原
document.getElementById("btnSolve").onclick=async ()=>{
    if(animating){status.textContent="动画运行中，请先停止";return;}
    status.textContent="正在计算复原方案...";
    try{
        const solver=new Kociemba.Solver();
        const solution=solver.solve(cubeState,24,0.02);
        if(solution){
            formulaDom.textContent=solution;
            status.textContent="开始执行复原动画";
            animating=true;
            const moves=solution.split(/\s+/);
            for(let m of moves){
                if(!animating)break;
                status.textContent=`执行转动: ${m}`;
                await sleep(400);
            }
            animating=false;status.textContent="复原完成！";
        }else status.textContent="魔方色块不合法，无法求解";
    }catch(err){status.textContent="求解失败，请检查网络";console.error(err);}
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
init();
</script>
</body>
</html>
