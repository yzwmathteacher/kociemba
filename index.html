<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔方上色控制系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: #1a1a2e;
            color: #ffffff;
            padding: 20px;
        }
        .main-wrap {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
            height: calc(100vh - 40px);
        }
        .left-panel {
            background: #16213e;
            padding: 20px;
            border-radius: 12px;
            height: 100%;
            overflow-y: auto;
        }
        .left-panel h2 {
            color: #4fc3f7;
            margin-bottom: 16px;
            font-size: 24px;
        }
        .color-area {
            margin-bottom: 20px;
        }
        .color-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .color-block {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            cursor: pointer;
            border: 3px solid transparent;
        }
        .color-block.active {
            border-color: #fff;
            transform: scale(1.08);
        }
        .w {background: #fff;}
        .y {background: #ffd600;}
        .r {background: #e53935;}
        .o {background: #fb8c00;}
        .b {background: #1e88e5;}
        .g {background: #43a047;}

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }
        button {
            padding: 14px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 500;
        }
        .blue-btn {background: #2196f3; color:white;}
        .orange-btn {background: #fb8c00; color:white;}
        .red-btn {background: #d32f2f; color:white;}
        .gray-btn {background: #eeeeee; color:#222;}
        .info-text {
            background: #0f3460;
            padding: 14px;
            border-radius: 8px;
            min-height: 100px;
            line-height: 1.6;
            margin-top:10px;
        }

        /* 右侧显示区域，固定可见！ */
        .right-view {
            background: #000000;
            border-radius:12px;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .demo-box{
            width:160px;
            height:160px;
            background:#2196f3;
            border-radius:8px;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:20px;
        }
    </style>
</head>
<body>
<div class="main-wrap">
    <div class="left-panel">
        <h2>魔方上色 & 控制</h2>
        <p>选择颜色后点击魔方方块填充</p>
        <div class="color-area">
            <div class="color-row">
                <div class="color-block w active" data-val="U"></div>
                <div class="color-block y" data-val="D"></div>
                <div class="color-block r" data-val="R"></div>
                <div class="color-block o" data-val="L"></div>
                <div class="color-block b" data-val="F"></div>
                <div class="color-block g" data-val="B"></div>
            </div>
            <p style="font-size:13px;margin-top:8px;color:#ccc">U=白顶 D=黄底 R=右红 L=左橙 F=前蓝 B=后绿</p>
        </div>
        <div class="btn-group">
            <button class="blue-btn" id="solve">一键自动复原魔方</button>
            <button class="blue-btn" id="play">自动播放复原动画</button>
            <button class="gray-btn" id="step">单步执行一步还原</button>
            <button class="orange-btn" id="shuffle">随机打乱魔方</button>
            <button class="red-btn" id="reset">重置魔方空白</button>
            <button class="blue-btn" id="standard">一键生成标准完整魔方</button>
        </div>
        <h3>还原步骤</h3>
        <div class="info-text" id="msg">右侧现在应该显示蓝色方块<br>如果依然全黑，是浏览器环境限制WebGL</div>
    </div>
    <!-- 右侧画布区域 -->
    <div class="right-view">
        <div class="demo-box">测试画面</div>
    </div>
</div>

<script>
// 颜色选择交互
let selectedColor = "U";
document.querySelectorAll(".color-block").forEach(item=>{
    item.onclick = ()=>{
        document.querySelectorAll(".color-block").forEach(c=>c.classList.remove("active"));
        item.classList.add("active");
        selectedColor = item.dataset.val;
    }
})

// 按钮占位函数（功能预留）
document.getElementById("standard").onclick = ()=>{
    document.getElementById("msg").innerText = "标准魔方初始化指令触发";
}
document.getElementById("shuffle").onclick = ()=>{
    document.getElementById("msg").innerText = "打乱指令触发";
}
</script>
</body>
</html>
