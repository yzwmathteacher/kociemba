<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D魔方控制系统</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, sans-serif;
    }

    body {
        background: #1a1a2e;
        color: #fff;
        height: 100vh;
        display: flex;
        overflow: hidden;
    }

    /* 左侧魔方区域 */
    #cube-area {
        width: 65%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        position: relative;
    }

    .scene {
        width: 280px;
        height: 280px;
        perspective: 600px;
        cursor: grab;
    }

    .scene:active {
        cursor: grabbing;
    }

    .cube {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transform: rotateX(-25deg) rotateY(45deg);
        transition: transform 0.05s ease-out;
    }

    .cubie {
        position: absolute;
        width: 90px;
        height: 90px;
        transform-style: preserve-3d;
    }

    .cubie .face {
        position: absolute;
        width: 90px;
        height: 90px;
        border: 2px solid #111;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 10px;
        font-weight: bold;
        color: rgba(0,0,0,0.35);
        cursor: pointer;
        transition: filter 0.15s;
        backface-visibility: hidden;
    }

    .cubie .face:hover {
        filter: brightness(1.15);
    }

    .cubie .front  { transform: translateZ(45px); }
    .cubie .back   { transform: rotateY(180deg) translateZ(45px); }
    .cubie .right  { transform: rotateY(90deg) translateZ(45px); }
    .cubie .left   { transform: rotateY(-90deg) translateZ(45px); }
    .cubie .top    { transform: rotateX(90deg) translateZ(45px); }
    .cubie .bottom { transform: rotateX(-90deg) translateZ(45px); }

    .cubie:nth-child(1)  { transform: translate3d(-95px, -95px, -95px); }
    .cubie:nth-child(2)  { transform: translate3d(   0px, -95px, -95px); }
    .cubie:nth-child(3)  { transform: translate3d( 95px, -95px, -95px); }

    .cubie:nth-child(4)  { transform: translate3d(-95px,    0px, -95px); }
    .cubie:nth-child(5)  { transform: translate3d(   0px,    0px, -95px); }
    .cubie:nth-child(6)  { transform: translate3d( 95px,    0px, -95px); }

    .cubie:nth-child(7)  { transform: translate3d(-95px,  95px, -95px); }
    .cubie:nth-child(8)  { transform: translate3d(   0px,  95px, -95px); }
    .cubie:nth-child(9)  { transform: translate3d( 95px,  95px, -95px); }

    .cubie:nth-child(10) { transform: translate3d(-95px, -95px,    0px); }
    .cubie:nth-child(11) { transform: translate3d(   0px, -95px,    0px); }
    .cubie:nth-child(12) { transform: translate3d( 95px, -95px,    0px); }

    .cubie:nth-child(13) { transform: translate3d(-95px,    0px,    0px); }
    .cubie:nth-child(14) { transform: translate3d(   0px,    0px,    0px); }
    .cubie:nth-child(15) { transform: translate3d( 95px,    0px,    0px); }

    .cubie:nth-child(16) { transform: translate3d(-95px,  95px,    0px); }
    .cubie:nth-child(17) { transform: translate3d(   0px,  95px,    0px); }
    .cubie:nth-child(18) { transform: translate3d( 95px,  95px,    0px); }

    .cubie:nth-child(19) { transform: translate3d(-95px, -95px,  95px); }
    .cubie:nth-child(20) { transform: translate3d(   0px, -95px,  95px); }
    .cubie:nth-child(21) { transform: translate3d( 95px, -95px,  95px); }

    .cubie:nth-child(22) { transform: translate3d(-95px,    0px,  95px); }
    .cubie:nth-child(23) { transform: translate3d(   0px,    0px,  95px); }
    .cubie:nth-child(24) { transform: translate3d( 95px,    0px,  95px); }

    .cubie:nth-child(25) { transform: translate3d(-95px,  95px,  95px); }
    .cubie:nth-child(26) { transform: translate3d(   0px,  95px,  95px); }
    .cubie:nth-child(27) { transform: translate3d( 95px,  95px,  95px); }

    /* 右侧控制面板 */
    #panel {
        width: 35%;
        padding: 24px;
        background: #20202e;
        overflow-y: auto;
        position: relative;
        z-index: 10;
    }

    #panel h2 {
        margin-bottom: 20px;
        color: #60a5fa;
        font-size: 20px;
    }

    .btn-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 24px;
    }

    button {
        padding: 12px 8px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        background: #2563eb;
        color: #fff;
        transition: 0.2s;
        pointer-events: auto;
    }

    button:hover {
        background: #3b82f6;
    }

    button.danger {
        background: #b93434;
    }

    button.danger:hover {
        background: #dc3838;
    }

    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .info {
        background: #2b2b3f;
        padding: 14px;
        border-radius: 8px;
        margin: 18px 0;
        line-height: 1.6;
        font-size: 13px;
        color: #cbd5e1;
    }

    .color-select {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 14px 0;
    }

    .color-item {
        width: 36px;
        height: 36px;
        border-radius: 6px;
        border: 3px solid transparent;
        cursor: pointer;
    }

    .color-item.active {
        border-color: #fff;
        transform: scale(1.08);
    }

    #status {
        margin-top: 12px;
        color: #94a3b8;
        font-size: 14px;
    }

    .formula-box {
        margin-top: 16px;
        background: #2b2b3f;
        padding: 12px;
        border-radius: 8px;
        word-break: break-all;
        min-height: 44px;
        font-size: 13px;
    }
</style>
</head>
<body>

<div id="cube-area">
    <div class="scene" id="scene">
        <div class="cube" id="cube"></div>
    </div>
</div>

<div id="panel">
    <h2>魔方控制面板</h2>

    <div class="btn-group">
        <button id="btnScramble">随机打乱魔方</button>
        <button id="btnReset">重置魔方</button>
        <button id="btnSolve">自动复原魔方</button>
        <button class="danger" id="btnStop">停止动画</button>
    </div>

    <div class="info">
        <p>🖱️ 鼠标拖拽：旋转视角</p>
        <p>🔍 滚轮：缩放画面</p>
        <p>🎨 选择颜色后点击魔方小块涂色</p>
        <p>✅ 涂色完成后点击【自动复原】</p>
    </div>

    <div>
        <p>选择涂色颜色：</p>
        <div class="color-select">
            <div class="color-item active" data-color="W" style="background:#ffffff"></div>
            <div class="color-item" data-color="R" style="background:#ff3333"></div>
            <div class="color-item" data-color="G" style="background:#00bb44"></div>
            <div class="color-item" data-color="B" style="background:#2277ff"></div>
            <div class="color-item" data-color="O" style="background:#ffaa22"></div>
            <div class="color-item" data-color="Y" style="background:#ffff22"></div>
        </div>
    </div>

    <div id="status">当前状态：初始复原状态</div>
    <div class="formula-box">复原公式：<span id="formulaText">无</span></div>
</div>

<script>
    const COLOR_MAP = {
        W: "#ffffff",
        R: "#ff3333",
        G: "#00bb44",
        B: "#2277ff",
        O: "#ffaa22",
        Y: "#ffff22",
        X: "#222222"
    };

    let selectedColor = "W";
    let animating = false;
    let cubeRotation = { x: -25, y: 45 };
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const scene = document.getElementById("scene");
    const cube = document.getElementById("cube");
    const statusText = document.getElementById("status");
    const formulaText = document.getElementById("formulaText");

    function createCube() {
        cube.innerHTML = "";

        for (let i = 0; i < 27; i++) {
            const cubie = document.createElement("div");
            cubie.className = "cubie";

            ["front", "back", "left", "right", "top", "bottom"].forEach(face => {
                const faceEl = document.createElement("div");
                faceEl.className = `face ${face}`;
                faceEl.dataset.face = face;
                faceEl.dataset.index = i;
                cubie.appendChild(faceEl);
            });

            cube.appendChild(cubie);
        }
    }

    function setStandardCube() {
        createCube();

        const cubies = document.querySelectorAll(".cubie");

        const layout = [
            { i: 0, top: "W", left: "O", back: "G" },
            { i: 1, top: "W", back: "G" },
            { i: 2, top: "W", right: "R", back: "G" },

            { i: 3, left: "O", back: "G" },
            { i: 4, back: "G" },
            { i: 5, right: "R", back: "G" },

            { i: 6, bottom: "Y", left: "O", back: "G" },
            { i: 7, bottom: "Y", back: "G" },
            { i: 8, bottom: "Y", right: "R", back: "G" },

            { i: 9, top: "W", left: "O" },
            { i: 10, top: "W" },
            { i: 11, top: "W", right: "R" },

            { i: 12, left: "O" },
            { i: 13, top: "W", bottom: "Y", left: "O", right: "R", front: "B", back: "G" },
            { i: 14, right: "R" },

            { i: 15, bottom: "Y", left: "O" },
            { i: 16, bottom: "Y" },
            { i: 17, bottom: "Y", right: "R" },

            { i: 18, top: "W", left: "O", front: "B" },
            { i: 19, top: "W", front: "B" },
            { i: 20, top: "W", right: "R", front: "B" },

            { i: 21, left: "O", front: "B" },
            { i: 22, front: "B" },
            { i: 23, right: "R", front: "B" },

            { i: 24, bottom: "Y", left: "O", front: "B" },
            { i: 25, bottom: "Y", front: "B" },
            { i: 26, bottom: "Y", right: "R", front: "B" }
        ];

        layout.forEach(item => {
            const cubie = cubies[item.i];
            const faces = cubie.querySelectorAll(".face");

            faces.forEach(faceEl => {
                const faceName = faceEl.dataset.face;
                const color = item[faceName];

                if (color) {
                    faceEl.style.background = COLOR_MAP[color];
                    faceEl.dataset.color = color;
                } else {
                    faceEl.style.background = COLOR_MAP.X;
                    faceEl.dataset.color = "X";
                }
            });
        });

        statusText.innerText = "当前状态：初始复原状态";
        formulaText.innerText = "无";
    }

    function bindColorPicker() {
        document.querySelectorAll(".color-item").forEach(el => {
            el.addEventListener("click", () => {
                document.querySelectorAll(".color-item").forEach(e => e.classList.remove("active"));
                el.classList.add("active");
                selectedColor = el.dataset.color;
            });
        });
    }

    function bindCubeClick() {
        document.querySelectorAll(".face").forEach(faceEl => {
            faceEl.addEventListener("click", () => {
                if (animating) return;

                faceEl.style.background = COLOR_MAP[selectedColor];
                faceEl.dataset.color = selectedColor;
            });
        });
    }

    function bindDrag() {
        scene.addEventListener("mousedown", e => {
            if (animating) return;
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener("mousemove", e => {
            if (!isDragging) return;

            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;

            cubeRotation.y += deltaX * 0.5;
            cubeRotation.x -= deltaY * 0.5;

            startX = e.clientX;
            startY = e.clientY;

            cube.style.transform = `rotateX(${cubeRotation.x}deg) rotateY(${cubeRotation.y}deg)`;
        });

        window.addEventListener("mouseup", () => {
            isDragging = false;
        });
    }

    function bindWheel() {
        scene.addEventListener("wheel", e => {
            e.preventDefault();
            const scale = e.deltaY > 0 ? 0.95 : 1.05;
            cube.style.transform = `rotateX(${cubeRotation.x}deg) rotateY(${cubeRotation.y}deg) scale(${scale})`;
        });
    }

    function resetCube() {
        document.querySelectorAll(".face").forEach(faceEl => {
            faceEl.style.background = COLOR_MAP.X;
            faceEl.dataset.color = "X";
        });

        statusText.innerText = "当前状态：魔方已清空";
        formulaText.innerText = "无";
    }

    function scramble() {
        if (animating) return;

        animating = true;
        statusText.innerText = "正在打乱魔方...";

        const moves = ["U", "U'", "D", "D'", "R", "R'", "L", "L'", "F", "F'", "B", "B'"];
        let result = "";

        for (let i = 0; i < 20; i++) {
            result += moves[Math.floor(Math.random() * moves.length)] + " ";
        }

        formulaText.innerText = result.trim();

        setTimeout(() => {
            animating = false;
            statusText.innerText = "当前状态：已打乱";
        }, 600);
    }

    function stopAnimation() {
        animating = false;
        statusText.innerText = "当前状态：动画已停止";
    }

    function solve() {
        statusText.innerText = "正在计算复原方案...";

        setTimeout(() => {
            statusText.innerText = "当前状态：演示模式，真实求解需接入Kociemba";
        }, 1000);
    }

    document.getElementById("btnReset").addEventListener("click", setStandardCube);
    document.getElementById("btnScramble").addEventListener("click", scramble);
    document.getElementById("btnStop").addEventListener("click", stopAnimation);
    document.getElementById("btnSolve").addEventListener("click", solve);

    createCube();
    setStandardCube();
    bindColorPicker();
    bindCubeClick();
    bindDrag();
    bindWheel();
</script>

</body>
</html>
